<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Good luck</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="Container">
      <!-- the beginning -->
      <aside id="sidebar">
        <div class="siderbar-H">
          <h2>Business system</h2>
        </div>
        <nav class="Nav">
          <ul>
            <li><a href="./index.html">Dashboard</a></li>
            <li><a href="./products.html">Products</a></li>
            <li><a href="./categories.html">Categories</a></li>
            <li><a href="./suppliers.html">Suppliers</a></li>
            <li><a href="./customers.html">Customers</a></li>
            <li><a href="./possales.html">POS / Sales</a></li>
            <li><a href="./inventory.html">Inventory</a></li>
            <li><a href="./exspenses.html">Expenses</a></li>
            <li><a href="./sales-report.html">Sales Report</a></li>
            <li><a href="./settings.html">Settings</a></li>
          </ul>
        </nav>
        <div class="sidebar-f">
          <a href="aboutus.html">About us</a>
        </div>
      </aside>
      <main>
        <div class="pos-head">
          <h3>Point Of Sales</h3>
        </div>

        <div class="pos-container">
          <div class="selection-row">
            <!-- Left Dropdown: Select Customer -->
            <div class="select-container">
              <select name="customer" class="dropdown-bar">
                <option value="" disabled selected>Select Customer</option>
                <option value="1">Inyene Edoho</option>
                <option value="2">Kennedy</option>
                <option value="3">Dan</option>
              </select>
            </div>

            <!-- Right Dropdown: Search Product -->
            <div class="select-container">
              <select name="product" class="dropdown-bar">
                <option value="" disabled selected>Search Product</option>
                <option value="1">PlayStation 5</option>
                <option value="2">Fourth Wing (Book)</option>
                <option value="3">PlayStation 3</option>
              </select>
            </div>

            <div class="sradd"><button>Add Item</button></div>
          </div>

          <div class="POS">
            <table>
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Price</th>
                  <th>Qty</th>
                  <th>Total</th>
                  <th>Action</th>
                </tr>
              </thead>
            </table>

            <div class="checkout-card">
              <div class="Checkout-Summary">
                <!-- row 1:subtotal -->
                <div class="summary-item">
                  <span class="label">Subtotal</span>
                  <span class="Value">0.00</span>
                </div>

                <!-- row 2 discount -->
                <div class="Summary-item">
                  <label for="discount" class="label">Discount:</label>
                  <input
                    type="number"
                    id="discount"
                    class="discount-input"
                    value="0"
                  />
                </div>

                <!-- Row 3 Grand total -->
                <div class="summary-item grand-total-row">
                  <span class="label">Grand Total</span>
                  <span class="value">0.00</span>
                </div>

                <!--Row 4 Payment method -->
                <div class="payment-cash">
                  <label for="payment-method" class="label"
                    >Payment Method</label
                  >
                  <select id="payment-method" class="payment-select">
                    <option value="cash">Cash</option>
                    <option value="card">Card</option>
                    <option value="transfer">Transfer</option>
                  </select>
                </div>

                <!-- Row 5: Action Button Triggers Container -->
                <div class="checkout-actions">
                  <button class="btn-save-print">
                    <span class="btn-icon">💾</span> Save & Print Receipt
                  </button>
                  <button class="btn-print-only">
                    <span class="btn-icon">🖨️</span> Print
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
