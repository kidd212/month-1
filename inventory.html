    <div id="Container">
      <!-- the beginning -->
      <aside id="sidebar">
        <div class="siderbar-H">
          <h2>Business system</h2>
        </div>
        <nav class="Nav">
          <ul>

        <div class="sidebar-f">

      </aside>

      <main id="Inventory">
        <div class="I-head">
          <h3>Inventory Management</h3>
        </div>

        <div class="I-body">
          <div class="I-table">
            <h4>low stocks alerts</h4>
            <table>
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Stock left</th>
                  <th>Status</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>PlayStation 5</td>
                  <td>3</td>
                  <td><span class="status-low">Low stock</span></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="I-table2">
            <h4>Stock in/Add new stock</h4>

            <form class="stock-form">
              <div class="form-group">
                <label for="Product-select">Select Product</label>
                <select id="product-select">
                  <option value="fourth-wing">fourth wing (Current: 95)</option>
                  <option value="playstation-5">
                    PlayStation 5 (Current: 3)
                  </option>
                  <option value="water">water (Current: 2)</option>
                </select>
              </div>

              <div class="form-group">
                <label for="stock-qty">Quantity to Add</label>
                <input type="number" id="stock-qty" min="1" step="1" />
              </div>

              <button type="submit" class="btn-update-stock">
                Update Stock
              </button>
            </form>
          </div>
        </div>
      </main>
    </div>
  </body>
